{
  "app": "VideoCraft",
  "version": "1.1.4",
  "what": "Browser-native video editor (SPA, no backend/auth). Timeline with video/audio tracks, captions, 3D scene clips. Exports MP4 (WebCodecs, faster) or WebM (real-time, has audio).",
  "headless": {
    "chromeFlags": "--no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader --autoplay-policy=no-user-gesture-required",
    "notes": "WebCodecs in headless Chrome encodes VP8/VP9+Opus only (no H.264/AAC) — the MP4 path then auto-falls back to real-time WebM recording. Audio needs a running AudioContext (autoplay policy). Parallel rendering: open N pages with ?headless=1, call render({start, end}) per chunk, stitch with ffmpeg concat — the WebM path records each chunk in real time, so N chunks render in ~1/N the wall time.",
    "dialogs": "alert() on empty-timeline export — dismiss dialogs (page.on('dialog', d => d.dismiss()))."
  },
  "preferredPath": {
    "url": "open this page with ?headless=1",
    "api": "window.vc.loadProject(projectJson) — REPLACES clips/scenes/captions/media (the default hero clip disappears); returns {name, aspect, duration, clips, scenes, captions}. window.vc.render({ postUrl, quality: 'high'|'standard'|'draft', start, end }) — encodes, POSTs the result blob to postUrl and RESOLVES ONLY WHEN THE EXPORT HAS FULLY FINISHED (both MP4 and WebM paths); progress in window.__vcProgress {stage, frame, frames}; result in window.__vcResult {name, size, type}. Optional start/end render only that timeline range (chunk-local timestamps) so several pages can render chunks in parallel; stitch the chunk files in order (ffmpeg concat). Scenes missing objects/camKeys/events/look are auto-normalized on load.",
    "receiver": "must answer CORS preflight (OPTIONS -> 204 + Access-Control-Allow-Origin: *) — the blob POST sends a non-simple Content-Type and triggers preflight; a POST-only receiver silently swallows the export."
  },
  "projectSchema": {
    "top": "{ app: 'videocraft', version: 1, name, aspect: '16:9'|'9:16'|'1:1'|'4:5'|'2.39:1', fps: 24|25|30|50|60, clips[], scenes[], captions[], media[] }",
    "clip": "{ id, track: 'v'|'a', kind: 'scene'|'media', mediaId?|sceneId?, start (s), dur (s), in (s, media offset), volume (0-1), fit: 'contain'|'cover'|'stretch' (v-track media only) } — v-track clips must not overlap; a scene clip's dur should equal its scene duration",
    "scene": "{ id, name, duration, sky: '#rrggbb', fog: 0-1 (FogExp2 density = fog*0.045; >0.3 hides distant objects), lighting: 'three-point'|'sunset'|'night'|'dramatic'|'daylight'|'neon'|'candlelight'|'horror'|'sunrise'|'storm'|'forest', camera: { pos: [x,y,z], target: [x,y,z] }, camKeys: [{ t, pos, target, ease }], look: { style, grade, bloom, vignette, grain, chroma, streak, exposure, outline, toonSteps }, objects[], events[] }",
    "camKey": "{ t (scene-local s), pos: [x,y,z], target: [x,y,z], ease: 'smooth'|'linear'|'easein'|'easeout'|'back'|'bounce'|'step' } — camera interpolates between time-sorted keys; with no keys the static camera is used",
    "lookFields": "style: 'film'|'anime'|'clean'; grade: natural|cine|noir|vibrant|scifi|sunset|comic|pastel|night|teal-orange|bleach|sepia|dream|moonlight|cyberpunk|forest|crimson|arctic; bloom 0-2; vignette 0-1; grain 0-0.3; chroma 0-2; streak 0-1.5; exposure 0.3-2 (dim presets night/storm/candlelight/horror need ~1.5-2.3 or scenes render nearly black); outline 0-2 (anime); toonSteps 2-8 (anime)",
    "objectCommon": "{ id, type, name, pos: [x,y,z], rot: [rx,ry,rz] (radians), scale: [sx,sy,sz], color: '#rrggbb', opacity: 1, keys: [{ t, pos?, rot?, scale?, ease }] } — keys animate the transform (scene-local seconds, eased, time-sorted)",
    "objectTypes": "ground (scale [w,1,d], locked to the floor); box (1x1x1); sphere (r=0.5, emissive); cylinder (r=0.5 h=1 — scale y = height); text ({ text, size } — billboard title plane, color = fill); character (see characterSchema); fx ({ fx, size } — particle emitter)",
    "characterSchema": "{ motion: 'none'|'idle'|'walk'|'run'|'wave'|'celebrate'|'jump'|'dance'|'point'|'nod'|'shakehead'|'punch'|'bow'|'sit', skin/hair/shirt/pants: '#rrggbb', build: { height, head, arms, legs, torso } (proportion factors, default 1), poseKeys: [{ t, pose }] } — non-empty poseKeys override motion entirely; poses interpolate (smoothstep) in scene-local seconds",
    "poseParams": "degrees: shLx, shLz, elL (left arm), shRx, shRz, elR (right arm), hipL, kneeL, hipR, kneeR (legs), headX, headY, torsoX, torsoY. Defaults: shLx 8, shRx 8, elL -15, elR -15, kneeL 4, kneeR 4, rest 0. shLz/shRz raise arms sideways (try ~65 / -65 for raised arms)",
    "fxKinds": "fire, explosion, confetti, sparks, fountain, rain, snow, embers, magic, smoke, lightning, portal, hearts, stars",
    "events": "[{ type: 'fadein'|'fadeout', t, dur }] black-overlay ramps; [{ type: 'letterbox', t, dur: 0 }] cinema bars from t on",
    "caption": "{ id, start, dur, text (multiline \\n), pos: 'bottom'|'middle'|'top', size (1 = 4.2% of frame height), color: '#rrggbb', bg: true|false } — burned into the export",
    "media": "{ id, type: 'video'|'image'|'audio', name, duration, data?: dataURL } — entries with data are restored on load (audio must be decodable: mp3/wav/ogg); entries without data re-link by file name on re-import"
  },
  "uiFallback": {
    "import": "page.setInputFiles('#file-import', [files]) — video/image/audio, multiple; import is ASYNC (metadata probing + audio decode, up to ~10s) so POLL for items",
    "mediaPanel": "media tab via .rail-btn[data-tab=\"media\"]; items are '#insp-body .list-item' — #insp-body is an ID (the aside is '#inspector', also an id, NOT a class: '.inspector .list-item' matches nothing)",
    "addToTimeline": "click each list item — video -> 'v' track, audio -> 'a' track; clips APPEND after existing clips on that track",
    "timeline": "'#track-v .clip' / '#track-a .clip'; style.left in px at 80 px/s; captions render as '.cap-pill'",
    "exportTab": ".rail-btn[data-tab=\"export\"]",
    "exportButtons": "#btn-export (MP4 WebCodecs) / #btn-export-webm (real-time WebM, has audio)",
    "quality": "#ex-quality: 0.2 high / 0.12 standard / 0.07 draft",
    "fps": "#ex-fps select — 24/25/30/50/60; also settable via the project fps field",
    "postUrl": "window.__vcPostUrl = url — BOTH export paths POST the exported blob there since v1.1.1 (WebM previously only downloaded)",
    "progress": "window.__vcProgress; overlay '#export-overlay', timer '#export-time' (timer stops advancing when finished, then wait for the POSTed blob)"
  },
  "gotchas": [
    "a fresh page is NOT empty: init adds a 6s hero SCENE clip on the video track plus a demo caption. In the UI flow delete it first (click '#track-v .clip.scene', press Delete) — otherwise imported video APPENDS at t=6s and desyncs from audio placed at t=0. loadProject replaces everything, so headless agents are unaffected.",
    "export tab Length is totalDur() — 6s on an 'empty' timeline means the hero clip is still there",
    "the media list re-renders on selection — click items by re-querying (querySelectorAll) each time, never hold stale element handles",
    "export resolution per aspect: 16:9 -> 1920x1080, 9:16 -> 1080x1920, 1:1 -> 1080x1080, 4:5 -> 1080x1350, 2.39:1 -> 1920x804; fps via #ex-fps; real-time WebM capture is 1x wall-clock",
    "dim lighting presets (night, storm, candlelight, horror, dramatic) need look.exposure ~1.5-2.3 and bright ground colors or scenes render nearly black",
    "fog is 0-1 (not 0-100): 0.15 subtle, 0.5 heavy; above ~0.3 distant objects disappear"
  ],
  "verifySync": "frame-match 1fps thumbnails of master vs source; cross-correlate audio (offset > 0.2s means the hero clip was present); then transcode: ffmpeg -i master.webm -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart out.mp4",
  "limits": [
    "real-time WebM capture can drop frames on slow machines; WebCodecs MP4 is faster but needs H.264/AAC encode support",
    "audio clips play through WebAudio — a suspended AudioContext (autoplay policy) yields silent exports",
    "no keyframe audio mixing"
  ]
}
</script>

<style>
:root {
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.125rem; --text-xl: 1.5rem;
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-6: 1.5rem; --space-8: 2rem;
  --bg: #131211; --surface: #1a1917; --surface-2: #201e1c; --surface-3: #262422;
  --border: #2d2b28; --border-strong: #3a3835;
  --text: #e6e2dc; --text-muted: #9b968f; --text-faint: #6b675f;
  --accent: #e8a13d; --accent-strong: #f0b35a; --accent-dim: #7a5518;
  --record: #e05d5d; --ok: #6db56b;
  --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
  --font-body: 'Satoshi', 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --transition: 160ms cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body {
  min-height: 100dvh; line-height: 1.55; font-family: var(--font-body); font-size: var(--text-base);
  color: var(--text); background: var(--bg); overflow: hidden;
}
button { cursor: pointer; background: none; border: none; color: inherit; font: inherit; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }
svg { display: block; }

/* ---------- top bar ---------- */
#topbar {
  height: 54px; display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-4); background: var(--surface); border-bottom: 1px solid var(--border);
  user-select: none;
}
.brand { display: flex; align-items: center; gap: var(--space-2); font-weight: 900; letter-spacing: -0.01em; }
.brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #131211; }
.brand .logo svg { width: 15px; height: 15px; }
#project-name {
  background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2); font-weight: 700; min-width: 60px; max-width: 220px; color: var(--text);
}
#project-name:hover { border-color: var(--border-strong); }
#project-name:focus { border-color: var(--accent); outline: none; }
.spacer { flex: 1; }
.field { display: flex; align-items: center; gap: var(--space-1); font-size: var(--text-xs); color: var(--text-muted); }
select, input[type='text'], input[type='number'] {
  background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-2); font-size: var(--text-sm);
}
input[type='color'] { width: 34px; height: 24px; padding: 0; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface-2); cursor: pointer; }
input[type='range'] { accent-color: var(--accent); }
textarea { font-family: var(--font-body); }
select:focus, input:focus { border-color: var(--accent); outline: none; }
.badge {
  font-size: var(--text-xs); font-weight: 700; padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-full, 999px); background: var(--surface-2); border: 1px solid var(--border-strong);
  font-family: var(--font-mono); white-space: nowrap;
}
.badge.ok { color: var(--ok); border-color: var(--ok); }
.badge.warn { color: var(--accent); border-color: var(--accent-dim); }
.btn {
  display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-sm); font-weight: 700;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
  background: var(--surface-2); border: 1px solid var(--border-strong);
  transition: background var(--transition), border-color var(--transition), color var(--transition);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); border-color: var(--text-faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #131211; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.danger { color: var(--record); }
.btn.tiny { padding: var(--space-1) var(--space-2); font-size: var(--text-xs); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---------- main layout ---------- */
#main { display: flex; height: calc(100dvh - 54px - 218px); min-height: 320px; }
#rail {
  width: 62px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-2); user-select: none;
}
.rail-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: var(--space-2) 0;
  border-radius: var(--radius-md); color: var(--text-muted); font-size: 10px; font-weight: 700;
  transition: background var(--transition), color var(--transition);
}
.rail-btn svg { width: 19px; height: 19px; }
.rail-btn:hover { color: var(--text); background: var(--surface-2); }
.rail-btn.active { color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent); }

#stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#preview-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--space-4);
  background:
    radial-gradient(1200px 500px at 50% -10%, color-mix(in oklab, var(--surface-2) 70%, transparent), transparent),
    var(--bg);
  position: relative; overflow: hidden; min-height: 0;
}
#preview {
  background: #000; border-radius: var(--radius-lg); box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  max-width: 100%; max-height: 100%; touch-action: none; cursor: grab;
}
#safe-margins { position: absolute; inset: var(--space-4); pointer-events: none; display: none; }
#transport {
  height: 52px; display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-4);
  background: var(--surface); border-top: 1px solid var(--border); user-select: none;
}
#transport .time { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-muted); min-width: 150px; }
#transport .time b { color: var(--text); font-weight: 600; }
#btn-play { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #131211; display: grid; place-items: center; }
#btn-play:hover { background: var(--accent-strong); }
#btn-play svg { width: 17px; height: 17px; }

#inspector {
  width: 300px; background: var(--surface); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden; user-select: none;
}
#inspector .insp-head {
  padding: var(--space-3) var(--space-4); font-size: var(--text-sm); font-weight: 900;
  border-bottom: 1px solid var(--border); letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-muted);
}
#inspector .insp-body { flex: 1; overflow-y: auto; padding: var(--space-3) var(--space-4) var(--space-8); }
.insp-section { margin-bottom: var(--space-6); }
.insp-title { font-size: var(--text-xs); font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-2); }
.row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
.row label { font-size: var(--text-sm); flex: 1; color: var(--text-muted); min-width: 0; }
.row input[type='range'] { flex: 1.2; accent-color: var(--accent); }
.row .val { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); min-width: 34px; text-align: right; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-2); }
.list-item {
  display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2);
  border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; margin-bottom: var(--space-1);
}
.list-item:hover { background: var(--surface-2); }
.list-item.selected { background: var(--surface-2); border-color: var(--accent-dim); }
.list-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.list-item .nm { flex: 1; font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .meta { font-size: var(--text-xs); color: var(--text-faint); font-family: var(--font-mono); }
.note { font-size: var(--text-xs); color: var(--text-faint); line-height: 1.5; margin-bottom: var(--space-2); }
.empty { padding: var(--space-6) var(--space-2); text-align: center; color: var(--text-faint); font-size: var(--text-sm); }

/* ---------- timeline ---------- */
#timeline { height: 218px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; user-select: none; }
#tl-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); }
#tl-head .title { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; }
#tl-zoom { width: 130px; accent-color: var(--accent); }
#tl-body { flex: 1; display: flex; min-height: 0; }
#tl-labels { width: 88px; border-right: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; }
.tl-label {
  height: 30px; display: flex; align-items: center; padding: 0 var(--space-3); gap: var(--space-2);
  font-size: var(--text-xs); font-weight: 700; color: var(--text-muted); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tl-label + .tl-label { height: 44px; }
.tl-label:last-child { flex: 1; min-height: 44px; }
.tl-label .tag { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: var(--surface-3); color: var(--text-faint); font-family: var(--font-mono); }
#tl-scroll { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; }
#tl-inner { position: relative; height: 100%; min-width: 100%; display: flex; flex-direction: column; }
#ruler { height: 30px; border-bottom: 1px solid var(--border); position: relative; cursor: pointer; flex-shrink: 0; }
#ruler canvas { width: 100%; height: 100%; }
.tl-track { height: 44px; border-bottom: 1px solid var(--border); position: relative; flex-shrink: 0; }
.tl-track.cap { height: 44px; flex: 1; min-height: 44px; }
.clip {
  position: absolute; top: 5px; height: 34px; border-radius: var(--radius-sm);
  background: linear-gradient(180deg, var(--surface-3), var(--surface-2)); border: 1px solid var(--border-strong);
  display: flex; align-items: center; overflow: hidden; cursor: grab;
}
.clip .grip { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
.clip .grip.l { left: 0; } .clip .grip.r { right: 0; }
.clip .lbl { font-size: var(--text-xs); font-weight: 700; padding: 0 var(--space-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.clip.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); z-index: 2; }
.clip.video { border-left: 3px solid var(--accent); }
.clip.scene { border-left: 3px solid #7fa8d9; background: linear-gradient(160deg, #24303c, var(--surface-2)); }
.clip.audio { border-left: 3px solid #6db56b; top: 5px; height: 34px; }
.clip.image { border-left: 3px solid #c77b9e; }
.cap-pill {
  position: absolute; border-radius: var(--radius-sm); border: 1px dashed var(--text-faint);
  display: flex; align-items: center; padding: 0 var(--space-2); cursor: grab; overflow: hidden;
  color: var(--text-muted); font-size: var(--text-xs);
}
.cap-pill.selected { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cap-pill .grip { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
.cap-pill .grip.l { left: 0; } .cap-pill .grip.r { right: 0; }
#playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--record); z-index: 5; pointer-events: none; }
#playhead::before { content: ''; position: absolute; top: 0; left: -4px; border: 5px solid transparent; border-top: 7px solid var(--record); }
#tl-inner.dragging, #tl-inner.dragging * { cursor: ew-resize !important; }

/* export progress overlay */
#export-overlay {
  position: fixed; inset: 0; background: rgba(10,9,8,0.82); display: none; place-items: center; z-index: 100;
}
#export-overlay .card {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
  padding: var(--space-8); text-align: center; min-width: 320px;
}
#export-overlay h3 { font-size: var(--text-lg); margin-bottom: var(--space-2); }
#export-overlay .bar { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin: var(--space-4) 0; }
#export-overlay .bar i { display: block; height: 100%; background: var(--accent); width: 0%; transition: width 200ms linear; }
#export-overlay .rec { color: var(--record); font-family: var(--font-mono); font-size: var(--text-sm); }
.hidden { display: none !important; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>
    <span>VideoCraft</span>
  </div>
  <input id="project-name" type="text" value="Untitled video" aria-label="Project name">
  <div class="field">
    <select id="aspect" aria-label="Aspect ratio">
      <option value="16:9">16:9 · Widescreen</option>
      <option value="9:16">9:16 · Shorts</option>
      <option value="1:1">1:1 · Square</option>
      <option value="4:5">4:5 · Portrait</option>
      <option value="2.39:1">2.39:1 · Cinema</option>
    </select>
  </div>
  <span class="badge ok" id="dur-badge">0:00</span>
  <div class="spacer"></div>
  <button class="btn" id="btn-new">New</button>
  <button class="btn" id="btn-save">Save</button>
  <button class="btn" id="btn-open">Open</button>
  <button class="btn primary" id="btn-export-top">Export</button>
</header>

<div id="main">
  <nav id="rail" aria-label="Tools">
    <button class="rail-btn active" data-tab="media" title="Media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14"/><path d="M18 15l6-4-6-4z"/></svg>Media</button>
    <button class="rail-btn" data-tab="scene" title="3D Scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 5-8 5-8-5z"/><path d="M12 22V12"/><path d="M4 7v10l8 5 8-5V7"/></svg>Scene</button>
    <button class="rail-btn" data-tab="captions" title="Captions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 12h6M14 12h4"/></svg>Caption</button>
    <button class="rail-btn" data-tab="look" title="Look & render"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>Look</button>
    <button class="rail-btn" data-tab="export" title="Export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>Export</button>
  </nav>

  <section id="stage">
    <div id="preview-wrap">
      <canvas id="preview" width="960" height="540"></canvas>
      <div id="safe-margins"></div>
    </div>
    <div id="transport">
      <button id="btn-back" class="btn" title="Back to start"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="btn-play" title="Play / pause (space)"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>
      <span class="time" id="time-label"><b>0:00.00</b> / 0:00.00</span>
      <div class="spacer"></div>
      <label class="field"><input type="checkbox" id="safe-toggle"> Safe margins</label>
      <span class="badge" id="fps-badge">30 fps</span>
    </div>
  </section>

  <aside id="inspector">
    <div class="insp-head" id="insp-head">Media</div>
    <div class="insp-body" id="insp-body"></div>
  </aside>
</div>

<footer id="timeline">
  <div id="tl-head">
    <span class="title">Timeline</span>
    <div class="spacer" style="flex:1"></div>
    <label class="field">Zoom <input type="range" id="tl-zoom" min="20" max="400" value="80"></label>
    <button class="btn tiny" id="btn-split">Split at playhead</button>
    <button class="btn tiny danger" id="btn-del">Delete selected</button>
  </div>
  <div id="tl-body">
    <div id="tl-labels">
      <div class="tl-label">Ruler</div>
      <div class="tl-label">V1 <span class="tag">video</span></div>
      <div class="tl-label">A1 <span class="tag">audio</span></div>
      <div class="tl-label">Caps <span class="tag">text</span></div>
    </div>
    <div id="tl-scroll">
      <div id="tl-inner">
        <div id="ruler"><canvas id="ruler-canvas"></canvas></div>
        <div class="tl-track" id="track-v"></div>
        <div class="tl-track" id="track-a"></div>
        <div class="tl-track cap" id="track-cap"></div>
        <div id="playhead"></div>
      </div>
    </div>
  </div>
</footer>

<div id="export-overlay">
  <div class="card">
    <h3>Recording export</h3>
    <p class="note" id="export-note">Recording in real time…</p>
    <div class="bar"><i id="export-bar"></i></div>
    <span class="rec" id="export-time">0:00.00</span>
  </div>
</div>

<input type="file" id="file-import" accept="video/*,image/*,audio/*" multiple class="hidden">
<input type="file" id="file-open" accept=".vfproject,.json" class="hidden">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js?v=1.4.4"></script>
</body>
</html>
