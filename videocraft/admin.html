<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AdminCraft — omniobservant</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07090f;
    --panel: rgba(18, 24, 38, 0.72);
    --panel-solid: #121826;
    --border: rgba(94, 118, 158, 0.18);
    --border-hot: rgba(93, 138, 255, 0.45);
    --text: #d9e1f0;
    --muted: #7d8aa3;
    --accent: #5d8aff;
    --accent-2: #9d6bff;
    --live: #ff4d6d;
    --ok: #3ddc97;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100dvh;
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 480px at 12% -8%, rgba(93, 138, 255, 0.16), transparent 60%),
      radial-gradient(900px 420px at 96% 4%, rgba(157, 107, 255, 0.13), transparent 60%),
      var(--bg);
    padding: clamp(14px, 3vw, 36px) clamp(12px, 4vw, 52px);
    padding-left: max(clamp(12px, 4vw, 52px), env(safe-area-inset-left));
    padding-right: max(clamp(12px, 4vw, 52px), env(safe-area-inset-right));
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding-bottom: 18px;
  }
  .logo {
    width: 42px; height: 42px; border-radius: 13px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 6px 24px rgba(93, 138, 255, 0.35);
  }
  .logo svg { width: 22px; height: 22px; }
  .title h1 { font-size: 19px; letter-spacing: 0.2px; }
  .title h1 b {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .title .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .live-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font: 12px/1 ui-monospace, monospace; letter-spacing: 0.4px;
    color: #ffd7de; background: rgba(255, 77, 109, 0.1);
    border: 1px solid rgba(255, 77, 109, 0.35);
    padding: 8px 13px; border-radius: 99px;
  }
  .live-pill .dot {
    width: 8px; height: 8px; border-radius: 99px; background: var(--live);
    box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.6); animation: ping 1.8s infinite;
  }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.55); }
    70% { box-shadow: 0 0 0 9px rgba(255, 77, 109, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); }
  }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    background: var(--panel); border: 1px solid var(--border);
    padding: 9px 16px; border-radius: 11px; backdrop-filter: blur(8px);
    transition: border-color 0.15s, transform 0.1s, background 0.15s;
  }
  button:hover { border-color: var(--border-hot); background: rgba(30, 40, 62, 0.8); }
  button:active { transform: scale(0.97); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), #4d76e8);
    border-color: transparent; color: #fff;
    box-shadow: 0 6px 20px rgba(93, 138, 255, 0.3);
  }
  button.primary:hover { filter: brightness(1.08); }

  /* ---------- stats strip ---------- */
  #stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin: 4px 0 22px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 16px; backdrop-filter: blur(10px);
  }
  .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); }
  .stat .v { font-size: 21px; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }

  /* ---------- columns ---------- */
  .cols {
    display: grid; grid-template-columns: minmax(300px, 4fr) minmax(340px, 8fr);
    gap: 18px; align-items: start;
  }
  @media (max-width: 920px) { .cols { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    backdrop-filter: blur(12px); overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 15px 18px; border-bottom: 1px solid var(--border);
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted);
  }
  .panel-head .count {
    margin-left: auto; font: 11px/1 ui-monospace, monospace; color: var(--accent);
    background: rgba(93, 138, 255, 0.12); border: 1px solid rgba(93, 138, 255, 0.3);
    padding: 5px 10px; border-radius: 99px; letter-spacing: 0.5px;
  }

  /* ---------- activity feed ---------- */
  #feed { max-height: min(64vh, 620px); overflow-y: auto; padding: 6px 0; overscroll-behavior: contain; }
  .entry {
    display: grid; grid-template-columns: 10px 1fr; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid rgba(94, 118, 158, 0.09);
    animation: slide-in 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .entry:last-child { border-bottom: none; }
  .entry.new .marker { background: var(--live); box-shadow: 0 0 12px rgba(255, 77, 109, 0.8); }
  .entry .marker {
    width: 8px; height: 8px; border-radius: 99px; margin-top: 5px;
    background: var(--border-hot);
  }
  .entry .t { font: 11px/1 ui-monospace, monospace; color: var(--muted); }
  .entry .m { margin-top: 2px; }
  .entry .p { color: var(--accent); font-size: 12px; font-family: ui-monospace, monospace; }
  @keyframes slide-in { from { opacity: 0; transform: translateY(-6px); } }

  /* ---------- project cards ---------- */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 13px; padding: 15px; }
  .card {
    position: relative; background: rgba(24, 31, 48, 0.75);
    border: 1px solid var(--border); border-radius: 14px; padding: 17px 18px;
    display: flex; flex-direction: column; gap: 12px;
    transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
  }
  .card:hover {
    border-color: var(--border-hot); transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(93, 138, 255, 0.15);
  }
  .card h3 { font-size: 16.5px; letter-spacing: 0.2px; padding-right: 54px; }
  .card .slug {
    position: absolute; top: 16px; right: 16px;
    font: 10px/1 ui-monospace, monospace; color: var(--muted);
    border: 1px solid var(--border); padding: 5px 8px; border-radius: 7px;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font: 11px/1 ui-monospace, monospace; color: #a9bbd6;
    background: rgba(93, 138, 255, 0.08); border: 1px solid rgba(94, 118, 158, 0.25);
    padding: 5px 9px; border-radius: 8px;
  }
  .actions { display: flex; gap: 8px; margin-top: auto; }
  .actions button { flex: 1; padding: 10px 8px; }
  #msg { color: var(--muted); padding: 0 18px 16px; font-size: 12.5px; }
  #msg.err { color: #ff8a9b; }
  .skel { color: var(--muted); padding: 18px; font-size: 13px; }

  @media (max-width: 640px) {
    header { gap: 10px; }
    .title h1 { font-size: 17px; }
    #stats { grid-template-columns: repeat(2, 1fr); }
    .actions button { padding: 12px 8px; }
    #grid { grid-template-columns: 1fr; padding: 12px; }
    #feed { max-height: 42vh; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></div>
  <div class="title">
    <h1>Admin<b>Craft</b></h1>
    <div class="sub">omniobservant — every project, every action, as it happens</div>
  </div>
  <div class="spacer"></div>
  <span class="live-pill"><span class="dot"></span><span id="watch-state">watching</span></span>
  <button id="refresh" title="Reload project list">Refresh</button>
  <button class="primary" id="new">＋ New project</button>
</header>

<div id="stats">
  <div class="stat"><div class="k">Projects</div><div class="v" id="st-projects">—</div></div>
  <div class="stat"><div class="k">Last action</div><div class="v" id="st-last">—</div></div>
  <div class="stat"><div class="k">Actions today</div><div class="v" id="st-today">—</div></div>
  <div class="stat"><div class="k">Feed</div><div class="v" id="st-feed">—</div></div>
</div>

<div class="cols">
  <section class="panel">
    <div class="panel-head">Live activity <span class="count" id="feed-count">0</span></div>
    <div id="feed"><div class="skel">connecting to the feed…</div></div>
  </section>

  <section class="panel">
    <div class="panel-head">Projects <span class="count" id="proj-count">…</span></div>
    <div id="grid"></div>
    <div id="msg">loading…</div>
  </section>
</div>

<script>
  // session gate: AdminCraft opens only through the secret link on the render
  // page (?admin=<secret>), which sets the flag below before redirecting.
  if (!sessionStorage.getItem('vcAdmin')) location.replace('./');

  const RAW = (p) => `https://raw.githubusercontent.com/HomekidChud/artcraft-live/main/videocraft/${p}`;
  const GH_API = 'https://api.github.com/repos/HomekidChud/artcraft-live/contents/videocraft/projects';
  const $ = (id) => document.getElementById(id);
  const seen = new Set();

  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  function entryEl(e) {
    const el = document.createElement('div');
    el.className = 'entry' + (seen.has(e.t + e.msg) ? '' : ' new');
    seen.add(e.t + e.msg);
    el.innerHTML = `
      <div class="marker"></div>
      <div>
        <div class="t">${new Date(e.t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })} · ${ago(e.t)}</div>
        <div class="m">${e.msg}${e.project ? ` <span class="p">${e.project}</span>` : ''}</div>
      </div>`;
    return el;
  }

  function updateStats(list) {
    $('st-projects').textContent = document.querySelectorAll('.card').length || '—';
    if (list.length) {
      const last = new Date(list[0].t);
      $('st-last').innerHTML = `${ago(list[0].t)} <small>${e2(list[0].msg)}</small>`;
      const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
      $('st-today').textContent = list.filter((e) => new Date(e.t) >= midnight).length;
    }
    $('st-feed').textContent = $('watch-state').textContent === 'watching' ? 'live' : 'reconnect';
  }
  const e2 = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&', '<': '<', '>': '>' }[c]));

  async function pollActivity() {
    try {
      const r = await fetch(`${RAW('projects/activity.json')}?t=${Date.now()}`);
      if (!r.ok) return;
      const d = await r.json();
      const list = (d.entries || []).slice(-60).reverse();
      const known = list.every((e) => seen.has(e.t + e.msg));
      if ($('feed').querySelector('.skel') || !known) {
        $('feed').innerHTML = '';
        for (const e of list) $('feed').appendChild(entryEl(e));
        $('feed-count').textContent = list.length;
      }
      $('watch-state').textContent = 'watching';
      updateStats(list);
    } catch (err) {
      $('watch-state').textContent = 'reconnecting…';
    }
  }

  function fmtDur(s) { const m = Math.floor(s / 60), r = Math.round(s % 60); return `${m}:${String(r).padStart(2, '0')}`; }

  function card(p, name, size) {
    const clips = p.clips || [];
    const total = clips.reduce((m, c) => Math.max(m, c.start + (c.dur || 0)), 0);
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <span class="slug">${name}</span>
      <h3>${e2(p.name || name)}</h3>
      <div class="meta">
        <span class="badge">${fmtDur(total)}</span>
        <span class="badge">${(p.scenes || []).length} scenes</span>
        <span class="badge">${(p.captions || []).length} captions</span>
        <span class="badge">${e2(p.aspect || '16:9')}</span>
        ${size ? `<span class="badge">${(size / 1e6).toFixed(1)} MB</span>` : ''}
      </div>
      <div class="actions">
        <button class="primary" data-watch="${e2(name)}">▶ Watch live</button>
        <button data-edit="${e2(name)}">Edit</button>
      </div>`;
    el.querySelector('[data-watch]').onclick = () =>
      location.href = `./?project=${encodeURIComponent(name)}&live=1&cinema=1&play=1`;
    el.querySelector('[data-edit]').onclick = () =>
      location.href = `./?project=${encodeURIComponent(name)}`;
    return el;
  }

  async function loadProjects() {
    $('grid').innerHTML = ''; $('msg').className = ''; $('msg').textContent = 'loading projects…';
    let files = null;
    try {
      const r = await fetch(GH_API, { headers: { Accept: 'application/vnd.github+json' } });
      if (!r.ok) throw new Error('api ' + r.status);
      files = (await r.json()).filter((f) => f.type === 'file' && f.name.endsWith('.json') && !['index.json', 'activity.json'].includes(f.name));
    } catch (err) {
      try {
        const list = await (await fetch(`projects/index.json?t=${Date.now()}`)).json();
        files = list.map((n) => ({ name: n, size: null }));
      } catch (e2) { $('msg').className = 'err'; $('msg').textContent = 'could not list projects: ' + err.message; return; }
    }
    for (const f of files) {
      try {
        const res = await fetch(`projects/${encodeURIComponent(f.name)}?t=${Date.now()}`);
        if (!res.ok) continue;
        const p = await res.json();
        $('grid').appendChild(card(p, f.name.replace(/\.json$/, ''), f.size));
      } catch (e) { /* skip unreadable */ }
    }
    $('proj-count').textContent = files.length;
    $('msg').textContent = 'watch links are live feeds — they hot-swap on every push · esc in the player returns here';
    updateStats([]);
  }

  $('refresh').onclick = loadProjects;
  $('new').onclick = () => location.href = './';
  loadProjects();
  pollActivity();
  setInterval(pollActivity, 8000);
</script>
</body>
</html>
