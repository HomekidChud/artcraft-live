<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>FigCraft</title>
  <script>
    // Renderer pre-flight — entry-page only, the app bundle is untouched.
    // FigCraft needs WebGPU or WebGL2. On some machines WebGPU exists but is
    // broken (driver reset: "the graphics device was lost"), which used to
    // leave the app stuck on "Loading…". Before starting the app we exercise
    // WebGPU with a real device and a tiny workload; if that fails we hide
    // navigator.gpu so the app's own fallback picks WebGL2. ?webgl2 forces it.
    (() => {
      const stubGpu = () => {
        try { Object.defineProperty(Navigator.prototype, "gpu", { configurable: true, get() { return undefined; } }); } catch (e) {}
      };
      const timeout = (p, ms) => Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]);
      window.figcraftRendererProbe = (async () => {
        const params = new URLSearchParams(location.search);
        const forced = params.has("webgl2") || params.has("webgl");
        let webgl2 = false;
        try { webgl2 = !!document.createElement("canvas").getContext("webgl2"); } catch (e) {}
        let gpu = "absent";
        if (forced) gpu = "forced";
        else if (navigator.gpu) {
          gpu = "ok";
          try {
            const adapter = await timeout(navigator.gpu.requestAdapter(), 2500);
            if (!adapter) gpu = "broken";
            else {
              const device = await timeout(adapter.requestDevice(), 2500);
              if (!device) gpu = "broken";
              else {
                // A device reports loss through its `lost` promise.
                let lost = false;
                try { if (device.lost) device.lost.then(() => { lost = true; }); } catch (e) {}
                try {
                  device.pushErrorScope("validation");
                  const src = device.createBuffer({ size: 16, usage: GPUBufferUsage.COPY_SRC });
                  const dst = device.createBuffer({ size: 16, usage: GPUBufferUsage.COPY_DST });
                  const enc = device.createCommandEncoder();
                  enc.copyBufferToBuffer(src, 0, dst, 0, 16);
                  device.queue.submit([enc.finish()]);
                  const err = await timeout(device.popErrorScope(), 2000);
                  const done = await timeout(device.queue.onSubmittedWorkDone(), 2000);
                  if (err || done === null || done === undefined) gpu = "broken";
                } catch (e) { gpu = "broken"; }
                await new Promise((r) => setTimeout(r, 300));
                if (lost) gpu = "broken";
                try { device.destroy(); } catch (e) {}
              }
            }
          } catch (e) { gpu = "broken"; }
        }
        window.figcraftRenderer = gpu;
        if (gpu === "broken" || gpu === "forced") {
          if (!webgl2) return "none";
          stubGpu();
          return "webgl2";
        }
        if (gpu === "absent") return webgl2 ? "webgl2" : "none";
        return "ok";
      })();
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
    #figcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #figcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #6b6b6b; font: 14px system-ui, sans-serif; pointer-events: none; padding: 0 16px; text-align: center; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #2c2c2c; }
      #figcraft_loading { color: #b8b8b8; }
    }
  </style>
</head>
<body>
  <canvas id="figcraft_canvas"></canvas>
  <div id="figcraft_loading">Loading FigCraft&hellip;</div>
<script src="../assistant/widget.js" data-craft="figcraft" defer></script>
<script type="module">
  // Wait for the renderer probe: on a browser that can run neither WebGPU nor
  // WebGL2 it explains the requirement instead of downloading a dead app; on a
  // browser with broken WebGPU it starts the app on WebGL2 (navigator.gpu is
  // hidden, so the app's own fallback chooses it).
  const probe = await window.figcraftRendererProbe;
  const loading = document.getElementById("figcraft_loading");
  if (probe === "none") {
    if (loading) {
      loading.innerHTML = "FigCraft needs WebGL2 or WebGPU for its canvas, and this browser has neither, so the app cannot run here. Try a current desktop browser (Chrome, Edge, Firefox or Safari).";
      loading.style.color = "#c0392b";
    }
  } else {
    if (loading && probe === "webgl2" && window.figcraftRenderer !== "absent") {
      loading.innerHTML = "WebGPU failed its startup check on this machine — starting on WebGL2&hellip;";
    }
    // The preloads are added only now: on a browser that cannot run the app the
    // ~22 MB wasm is never requested at all.
    for (const attrs of [
      ["modulepreload", "./figcraft-web-93633486fb4e85a4.js", null],
      ["preload", "./figcraft-web-93633486fb4e85a4_bg.wasm", "application/wasm"],
    ]) {
      const link = document.createElement("link");
      link.rel = attrs[0];
      link.href = attrs[1];
      link.crossOrigin = "anonymous";
      if (attrs[2]) { link.as = "fetch"; link.type = attrs[2]; }
      document.head.appendChild(link);
    }
    const mod = await import("./figcraft-web-93633486fb4e85a4.js");
    const wasm = await mod.default({ module_or_path: "./figcraft-web-93633486fb4e85a4_bg.wasm" });
    window.wasmBindings = mod;
    dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
  }
</script>
</body>
</html>
