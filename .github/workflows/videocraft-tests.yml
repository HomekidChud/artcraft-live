name: VideoCraft tests
on:
  pull_request:
    paths:
      - 'videocraft/**'
      - 'package.json'
      - '.github/workflows/videocraft-tests.yml'
  push:
    branches: [main]
    paths:
      - 'videocraft/**'
      - 'package.json'
      - '.github/workflows/videocraft-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check videocraft/app.js && node --check videocraft/avatar3d.js
      - run: npm run test:videocraft
      - run: npm test
