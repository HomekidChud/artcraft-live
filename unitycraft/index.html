<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnityCraft — Unity Hub & Editor, in your browser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131313'/%3E%3Cpath fill='%23e1e1e1' d='M32 12l14 8-14 8-14-8 14-8zm14 12v16l-14 8-14-8V24l14 8 14-8z'/%3E%3C/svg%3E">
<meta name="description" content="UnityCraft — a browser reconstruction of the Unity Hub launcher and a Unity Editor-style 3D workspace: scene view, hierarchy, inspector, play mode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     UnityCraft — browser reconstruction of Unity Hub 3.22.3 (dark)
     and a Unity Editor-style workspace.
     Hub chrome evidence: UnityHubSetup-x86_64.AppImage (Unity Hub
     3.22.3, Electron) — extracted renderer HTML/CSS + module map.
     ============================================================ */
  :root {
    --hub-bg: #131313;          /* Hub loading screen bg (observed) */
    --hub-surface: #1b1b1b;
    --hub-surface-2: #212121;
    --hub-border: #2b2b2b;
    --hub-text: #e1e1e1;        /* Hub logo fill (observed) */
    --hub-muted: #9a9a9a;
    --hub-accent: #cddc39;      /* Unity lime accent */
    --ed-bg: #191919;
    --ed-panel: #1f1f1f;
    --ed-panel-2: #232323;
    --ed-header: #2a2a2a;
    --ed-border: #121212;
    --ed-border-soft: #333333;
    --ed-text: #b4b4b4;
    --ed-text-bright: #dcdcdc;
    --ed-muted: #7a7a7a;
    --ed-blue: #2f5d8a;         /* Unity selection blue */
    --ed-blue-hover: #38659a;
    --ed-toolbar: #3d3d3d;
    --ed-gizmo-x: #e23d4e;
    --ed-gizmo-y: #63a83b;
    --ed-gizmo-z: #3a7bd0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--hub-bg);
    color: var(--hub-text);
    overflow: hidden;
    font-size: 13px;
    line-height: 1.45;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Hub loading screen (recreated from extracted CSS) ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    background: var(--hub-bg);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .6s ease, visibility .6s;
  }
  #loading.is-dismissed { opacity: 0; visibility: hidden; }
  .hub-logo { width: 65px; height: 65px; transform: scale(1.4); }
  .hub-logo .logo { fill: var(--hub-text); transform-origin: 50%; transform: scale(.8); animation: .3s cubic-bezier(.7,0,.84,0) forwards hub-logo-scale-out; }
  .hub-logo circle { fill: none; stroke: #363636; stroke-dasharray: 80 200; stroke-dashoffset: 0; stroke-linecap: round; stroke-width: 1.5px; transform-origin: 32% 32%; will-change: transform; animation: 1.4s linear infinite hub-logo-rotate, 1.4s ease-in-out infinite hub-logo-spin; }
  @keyframes hub-logo-rotate { 0% { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes hub-logo-spin { 0% { stroke-dasharray: 1 200; stroke-dashoffset: 0; } 50% { stroke-dasharray: 100 200; stroke-dashoffset: -50px; } to { stroke-dasharray: 100 200; stroke-dashoffset: -185px; } }
  @keyframes hub-logo-scale-out { 0% { transform: scale(.8); } to { transform: translate(-10px,-10px) scale(0); } }

  /* ---------- Hub window ---------- */
  #hub { display: flex; height: 100dvh; }
  .hub-titlebar {
    position: fixed; top: 0; left: 0; right: 0; height: 36px;
    display: flex; align-items: center; gap: 10px;
    background: var(--hub-surface); border-bottom: 1px solid var(--hub-border);
    -webkit-app-region: drag; z-index: 10; padding: 0 12px;
  }
  .hub-titlebar .dot { width: 11px; height: 11px; border-radius: 50%; background: #3d3d3d; }
  .hub-titlebar .title { color: var(--hub-muted); font-size: 12px; }
  .hub-titlebar .winbtns { margin-left: auto; display: flex; gap: 14px; color: var(--hub-muted); -webkit-app-region: no-drag; }
  .hub-sidebar {
    width: 200px; flex-shrink: 0; margin-top: 36px;
    background: var(--hub-surface); border-right: 1px solid var(--hub-border);
    display: flex; flex-direction: column; padding: 10px 8px;
  }
  .hub-nav { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 6px; color: var(--hub-muted); cursor: pointer; font-weight: 500; }
  .hub-nav:hover { background: var(--hub-surface-2); color: var(--hub-text); }
  .hub-nav.active { background: #2c2c2c; color: #fff; }
  .hub-nav svg { width: 17px; height: 17px; flex-shrink: 0; }
  .hub-sidebar .spacer { flex: 1; }
  .hub-sidebar .foot { padding: 8px 12px; color: #6d6d6d; font-size: 11px; }
  .hub-main { flex: 1; margin-top: 36px; overflow-y: auto; padding: 26px 30px 40px; }
  .hub-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .hub-head h2 { font-size: 19px; font-weight: 600; color: #fff; }
  .hub-search {
    margin-left: auto; background: var(--hub-surface-2); border: 1px solid var(--hub-border);
    border-radius: 6px; color: var(--hub-muted); padding: 7px 12px; width: 220px; outline: none;
  }
  .hub-search:focus { border-color: #4a4a4a; }
  .btn {
    padding: 7px 14px; border-radius: 6px; font-weight: 600; font-size: 12.5px;
    background: var(--hub-surface-2); border: 1px solid var(--hub-border); color: var(--hub-text);
  }
  .btn:hover { background: #2a2a2a; }
  .btn.primary { background: #fff; color: #131313; border-color: #fff; }
  .btn.primary:hover { background: #e8e8e8; }
  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .project-card {
    background: var(--hub-surface); border: 1px solid var(--hub-border); border-radius: 8px;
    padding: 16px; cursor: pointer; transition: border-color .15s;
  }
  .project-card:hover { border-color: #5a5a5a; }
  .project-card .thumb {
    height: 110px; border-radius: 6px; margin-bottom: 12px;
    display: grid; place-items: center; font-size: 34px; color: rgba(255,255,255,.75);
  }
  .project-card h3 { font-size: 14px; color: #fff; font-weight: 600; margin-bottom: 4px; }
  .project-card .row { display: flex; align-items: center; gap: 8px; color: var(--hub-muted); font-size: 12px; }
  .ver-chip { border: 1px solid var(--hub-border); border-radius: 99px; padding: 1px 8px; font-size: 11px; }
  .favorite { margin-left: auto; color: #6d6d6d; cursor: pointer; font-size: 15px; }
  .favorite.on { color: #e8b93c; }
  .hub-section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--hub-muted); margin: 26px 0 12px; font-weight: 600; }

  /* ---------- New project modal ---------- */
  #modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50;
    display: none; align-items: center; justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  .modal {
    width: min(860px, 92vw); max-height: 86dvh; overflow-y: auto;
    background: var(--hub-surface); border: 1px solid var(--hub-border); border-radius: 10px;
    padding: 24px 26px;
  }
  .modal h2 { color: #fff; font-size: 17px; margin-bottom: 16px; font-weight: 600; }
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tpl {
    border: 1px solid var(--hub-border); border-radius: 8px; padding: 12px; cursor: pointer;
    background: var(--hub-surface-2);
  }
  .tpl:hover { border-color: #5a5a5a; }
  .tpl.selected { border-color: var(--hub-accent); box-shadow: 0 0 0 1px var(--hub-accent); }
  .tpl .art { height: 84px; border-radius: 5px; margin-bottom: 10px; display: grid; place-items: center; font-size: 28px; }
  .tpl .nm { font-weight: 600; color: #e8e8e8; font-size: 13px; }
  .tpl .ds { color: var(--hub-muted); font-size: 11.5px; margin-top: 3px; }
  .form-row { display: flex; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 200px; }
  .field label { display: block; color: var(--hub-muted); font-size: 12px; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; background: var(--hub-surface-2); border: 1px solid var(--hub-border);
    border-radius: 6px; padding: 8px 10px; color: var(--hub-text); outline: none;
  }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }

  /* ---------- Editor ---------- */
  #editor { display: none; height: 100dvh; flex-direction: column; background: var(--ed-bg); }
  .ed-menubar {
    height: 30px; display: flex; align-items: stretch; background: #2b2b2b; flex-shrink: 0;
    border-bottom: 1px solid var(--ed-border); user-select: none;
  }
  .ed-menubar .brand { display: flex; align-items: center; padding: 0 10px 0 8px; color: #eee; font-weight: 700; font-size: 12px; }
  .ed-menu { position: relative; }
  .ed-menu > button { padding: 0 11px; color: #c8c8c8; font-size: 12px; height: 100%; }
  .ed-menu > button:hover, .ed-menu.open > button { background: #3a3a3a; color: #fff; }
  .ed-dropdown {
    position: absolute; top: 100%; left: 0; min-width: 210px; background: #2b2b2b;
    border: 1px solid #111; border-radius: 0 0 4px 4px; z-index: 60; display: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.5); padding: 4px 0;
  }
  .ed-menu.open .ed-dropdown { display: block; }
  .ed-dropdown button { display: flex; justify-content: space-between; gap: 24px; width: 100%; text-align: left; padding: 5px 12px; font-size: 12px; color: #c8c8c8; }
  .ed-dropdown button:hover { background: var(--ed-blue); color: #fff; }
  .ed-dropdown .sep { height: 1px; background: #1c1c1c; margin: 4px 2px; }
  .ed-toolbar {
    height: 36px; background: var(--ed-toolbar); display: flex; align-items: center; padding: 0 8px;
    gap: 6px; flex-shrink: 0; border-bottom: 1px solid var(--ed-border); user-select: none;
  }
  .tool {
    width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; color: #c8c8c8;
    font-size: 13px; font-weight: 700;
  }
  .tool:hover { background: #4a4a4a; color: #fff; }
  .tool.active { background: #585858; color: #fff; box-shadow: inset 0 0 0 1px #666; }
  .toolbar-group { display: flex; gap: 2px; padding: 0 8px; border-right: 1px solid #2f2f2f; height: 26px; align-items: center; }
  .toolbar-group:last-child { border-right: none; }
  .play-btn { width: 30px; height: 26px; border-radius: 4px; display: grid; place-items: center; color: #c8c8c8; }
  .play-btn svg { width: 14px; height: 14px; }
  .play-btn:hover { background: #4a4a4a; }
  .play-btn.active { background: #7aad4a; color: #0e120a; }
  .ed-toolbar .center { margin: 0 auto; display: flex; gap: 2px; }
  .ed-toolbar .right { display: flex; align-items: center; gap: 6px; color: #9a9a9a; font-size: 11px; }
  .ed-body { flex: 1; display: flex; min-height: 0; }
  .ed-col-left { width: 216px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--ed-panel); border-right: 1px solid var(--ed-border); }
  .ed-col-center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .ed-col-right { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--ed-panel); border-left: 1px solid var(--ed-border); }
  .ed-col-bottom { height: 230px; display: flex; flex-direction: column; background: var(--ed-panel); border-top: 1px solid var(--ed-border); }
  .panel-tabs {
    height: 26px; display: flex; align-items: stretch; background: var(--ed-header); flex-shrink: 0;
    user-select: none; overflow: hidden;
  }
  .ptab {
    display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 12px; color: #a0a0a0;
    border-right: 1px solid var(--ed-border); cursor: pointer; white-space: nowrap;
  }
  .ptab.active { background: var(--ed-panel); color: #e6e6e6; box-shadow: inset 0 2px 0 #888; }
  .ptab:not(.active):hover { background: #313131; color: #d6d6d6; }
  .ptab .x { opacity: .5; font-size: 11px; }
  .panel-body { flex: 1; overflow-y: auto; min-height: 0; position: relative; }

  /* Hierarchy */
  #hierarchy { font-size: 12px; }
  .hitem {
    display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: default; color: #c8c8c8;
    border-left: 2px solid transparent;
  }
  .hitem:hover { background: #2a2a2a; }
  .hitem.selected { background: var(--ed-blue); color: #fff; }
  .hitem .icon { font-size: 11px; width: 14px; text-align: center; color: #8f8f8f; }
  .hitem.selected .icon { color: #d6e4f5; }
  .hitem .caret { width: 12px; font-size: 9px; color: #777; }

  /* Scene view */
  #scene-container { flex: 1; position: relative; min-height: 0; background: #262626; }
  #scene-container canvas { display: block; }
  #scene-toolbar {
    position: absolute; top: 6px; left: 8px; display: flex; gap: 10px; align-items: center;
    color: #9c9c9c; font-size: 11px; z-index: 5; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #scene-toolbar label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  #axis-gizmo {
    position: absolute; right: 14px; bottom: 14px; width: 92px; height: 92px; z-index: 5;
    pointer-events: none;
  }
  #scene-overlay {
    position: absolute; left: 10px; bottom: 10px; color: #8f8f8f; font-size: 11px; z-index: 5;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .tint-play { position: absolute; inset: 0; background: rgba(60,90,160,.10); pointer-events: none; z-index: 4; }

  /* Inspector */
  #inspector { font-size: 12px; }
  .insp-header {
    padding: 8px 10px; background: #2a2a2a; color: #e0e0e0; display: flex; align-items: center; gap: 8px;
    position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--ed-border);
  }
  .insp-header .checks { margin-left: auto; display: flex; gap: 10px; color: #8f8f8f; }
  .comp {
    border-bottom: 1px solid var(--ed-border); background: var(--ed-panel-2); margin-bottom: 1px;
  }
  .comp-header {
    padding: 6px 10px; background: #2a2a2a; display: flex; align-items: center; gap: 8px;
    cursor: pointer; color: #dcdcdc; font-weight: 600; font-size: 12px; user-select: none;
  }
  .comp-header .fold { font-size: 9px; color: #909090; transition: transform .12s; }
  .comp.collapsed .comp-header .fold { transform: rotate(-90deg); }
  .comp.collapsed .comp-body { display: none; }
  .comp-body { padding: 8px 10px 10px; }
  .vec3 { display: grid; grid-template-columns: 52px 1fr 1fr 1fr; gap: 3px; align-items: center; margin-bottom: 5px; }
  .vec3 .lbl { color: var(--ed-muted); font-size: 11.5px; }
  .vec3 .cell { display: flex; align-items: center; }
  .vec3 .cell .ax { font-size: 10px; color: var(--ed-muted); padding: 0 3px; }
  .vec3 input[type=number] {
    width: 100%; background: #191919; border: 1px solid #2f2f2f; border-radius: 3px;
    color: #c8c8c8; padding: 3px 4px; font-size: 11.5px; outline: none; -moz-appearance: textfield;
  }
  .vec3 input[type=number]:focus { border-color: #4a6d94; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .kv { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .kv .k { width: 92px; color: var(--ed-muted); font-size: 11.5px; flex-shrink: 0; }
  .kv input[type=text], .kv input[type=color], .kv input[type=number], .kv select {
    flex: 1; background: #191919; border: 1px solid #2f2f2f; border-radius: 3px; color: #c8c8c8;
    padding: 3px 6px; font-size: 11.5px; outline: none; min-width: 0;
  }
  .kv input[type=color] { height: 22px; padding: 1px 2px; }
  .kv input[type=checkbox] { accent-color: #7aad4a; }

  /* Project window */
  .assets { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; }
  .asset {
    width: 86px; padding: 8px 4px; border-radius: 5px; text-align: center; cursor: pointer;
    color: #b4b4b4; font-size: 11px;
  }
  .asset:hover { background: #2e2e2e; }
  .asset .ico { font-size: 26px; margin-bottom: 4px; display: block; }
  .console-line { padding: 4px 12px; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11.5px; border-bottom: 1px solid #242424; color: #b4b4b4; display: flex; gap: 8px; }
  .console-line .t { color: #6f6f6f; flex-shrink: 0; }
  .console-line.warn { color: #d8b93c; }
  .console-line.err { color: #e06060; }
  .console-line.sys { color: #7aa5d8; }

  .ed-statusbar {
    height: 22px; background: #1c1c1c; color: #7c7c7c; font-size: 11px; display: flex; align-items: center;
    padding: 0 10px; gap: 18px; flex-shrink: 0; border-top: 1px solid var(--ed-border); user-select: none;
  }
  .ed-statusbar .space { flex: 1; }

  .hidden { display: none !important; }
  @media (max-width: 860px) {
    .ed-col-left { width: 150px; } .ed-col-right { width: 200px; } .ed-col-bottom { height: 150px; }
  }
</style>
</head>

<!-- ===== Unity Hub window ===== -->
<div id="hub">
  <div class="hub-titlebar">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="title">Unity Hub 3.22.3</span>
    <span class="winbtns"><span>—</span><span>▢</span><span>✕</span></span>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

/* ================================================================
   PART 1 — UNITY HUB (evidence-based reconstruction)
   Routes & features recovered from the Hub renderer bundle:
   projects / installs / learn / new-project / templates …
   ================================================================ */
const $ = s => document.querySelector(s);
const state = {
  hubView: 'projects',
  favorites: new Set(['Roll-a-Ball remake']),
  projects: [
    { name: 'Roll-a-Ball remake', ver: '6000.1.7f1', modified: '2 hours ago', hue: 210, emoji: '🟦', target: 'cube' },
    { name: 'FPS Playground', ver: '6000.1.7f1', modified: 'yesterday', hue: 130, emoji: '🎯', target: 'sphere' },
    { name: 'LowPolyIsland', ver: '2022.3.50f1', modified: '4 days ago', hue: 45, emoji: '🏝️', target: 'plane' },
  ],
  installs: [
    { ver: '6000.1.7f1 (LTS)', date: 'Oct 12, 2026', mods: ['Linux Build Support (IL2CPP)', 'Android Build Support'] },
    { ver: '2022.3.50f1 (LTS)', date: 'Aug 2, 2026', mods: ['WebGL Build Support'] },
  ],
  learn: [
    { t: 'Unity Essentials', d: 'Pathway · 10 hrs', emoji: '🧭' },
    { t: 'Creative Core', d: 'Pathway · 16 hrs', emoji: '🎨' },
    { t: 'Roll-a-Ball', d: 'Tutorial · 45 min', emoji: '⚽' },
    { t: 'Junior Programmer', d: 'Pathway · 40 hrs', emoji: '💻' },
  ],
};

const TEMPLATES = [
  { id: '3d', name: 'Universal 3D', desc: 'URP · Default 3D template', emoji: '🧊', bg: 210 },
  { id: '3d-hd', name: 'High Definition 3D', desc: 'HDRP · AAA quality', emoji: '🌄', bg: 260 },
  { id: '2d', name: 'Universal 2D', desc: 'URP · Sprites and tiles', emoji: '🕹️', bg: 130 },
  { id: 'mobile', name: 'Mobile 3D', desc: 'URP · Touch input ready', emoji: '📱', bg: 45 },
];
let selectedTemplate = '3d';

function renderHub() {
  const main = $('#hub-main');
  document.querySelectorAll('.hub-nav').forEach(n => n.classList.toggle('active', n.dataset.view === state.hubView));
  if (state.hubView === 'projects') {
    main.innerHTML = `
      <div class="hub-head">
        <h2>Projects</h2>
        <input class="hub-search" id="hub-search" placeholder="Search projects…" value="">
        <button class="btn primary" id="btn-new">＋ New project</button>
      </div>
      <div class="project-grid" id="project-grid"></div>
      <div class="hub-section-title">Recent projects</div>
      <div class="project-grid" id="recent-grid"></div>`;
    renderProjectCards('#project-grid', true);
    renderProjectCards('#recent-grid', false);
    $('#btn-new').onclick = openNewProject;
    $('#hub-search').oninput = e => filterProjects(e.target.value.toLowerCase());
  } else if (state.hubView === 'installs') {
    main.innerHTML = `
      <div class="hub-head">
        <h2>Installs</h2>
        <span style="color:var(--hub-muted);font-size:12px">Official releases</span>
        <button class="btn" id="btn-install" style="margin-left:auto">Install Editor</button>
      </div>
      ${state.installs.map(i => `
      <div style="background:var(--hub-surface);border:1px solid var(--hub-border);border-radius:8px;padding:16px 18px;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:12px">
          <svg width="26" height="26" viewBox="-12 -12 66 66"><path fill="#7a7a7a" d="M31.53 10v7.06l6.26 3.61c.05.03.1.08.13.13.03.05.05.11.05.17 0 .06-.02.12-.05.17-.03.06-.08.1-.13.13l-7.44 4.29c-.11.06-.23.09-.35.09s-.24-.03-.35-.09l-7.44-4.28c-.05-.03-.1-.07-.13-.12-.03-.05-.05-.11-.05-.17 0-.06.02-.12.05-.17.03-.05.07-.1.13-.12l6.26-3.61V10L12.5 19.21 30 29.3l17.5-10.09V37.62l-6.13-3.53v-7.21c0-.06.02-.12.05-.18.03-.05.07-.1.13-.13.05-.03.11-.05.17-.05.06 0 .12.02.18.05l7.44 4.29c.11.06.19.15.25.25.06.11.09.22.09.34v8.58c0 .06-.02.12-.05.18-.03.05-.07.1-.13.13-.05.03-.11.05-.17.05-.06 0-.12-.02-.18-.05l-6.26-3.61-6.12 3.53 15.97 9.21v-18.4L47.5 19.21 31.53 10z"/></svg>
          <div>
            <div style="color:#fff;font-weight:600">${i.ver}</div>
            <div style="color:var(--hub-muted);font-size:12px">Added ${i.date}</div>
          </div>
          <span class="ver-chip" style="margin-left:auto">${i.mods.length} modules</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          ${i.mods.map(m => `<span class="ver-chip">${m}</span>`).join('')}
        </div>
      </div>`).join('')}`;
    $('#btn-install').onclick = () => toast('Editor download is simulated in UnityCraft — the real 3.5 GB editor lives at unity.com/download');
  } else if (state.hubView === 'learn') {
    main.innerHTML = `
      <div class="hub-head"><h2>Learn</h2></div>
      <div class="hub-section-title">Featured pathways</div>
      <div class="project-grid">
        ${state.learn.map(l => `
        <div class="project-card">
          <div class="thumb" style="background:hsl(${l.emoji === '🧭' ? 210 : l.emoji === '🎨' ? 280 : l.emoji === '⚽' ? 45 : 140} 30% 24%)">${l.emoji}</div>
          <h3>${l.t}</h3>
          <div class="row"><span>${l.d}</span></div>
        </div>`).join('')}
      </div>`;
  } else if (state.hubView === 'community') {
    main.innerHTML = `
      <div class="hub-head"><h2>Community</h2></div>
      <div class="project-grid">
        <div class="project-card"><div class="thumb" style="background:hsl(210 30% 24%)">💬</div><h3>Unity Discussions</h3><div class="row"><span>Ask questions, get answers</span></div></div>
        <div class="project-card"><div class="thumb" style="background:hsl(130 30% 24%)">📚</div><h3>Documentation</h3><div class="row"><span>Manual & Scripting API</span></div></div>
        <div class="project-card"><div class="thumb" style="background:hsl(45 30% 24%)">🎮</div><h3>Asset Store</h3><div class="row"><span>Free & paid assets</span></div></div>
      </div>`;
  } else if (state.hubView === 'preferences') {
    main.innerHTML = `
      <div class="hub-head"><h2>Preferences</h2></div>
      <div style="background:var(--hub-surface);border:1px solid var(--hub-border);border-radius:8px;padding:18px;max-width:560px">
        <div class="kv" style="margin-bottom:10px"><span class="k" style="color:var(--hub-muted)">Theme</span><span style="color:#fff">Dark</span></div>
        <div class="kv" style="margin-bottom:10px"><span class="k" style="color:var(--hub-muted)">Editor install location</span><span style="color:#fff">~/Unity/Hub/Editor</span></div>
        <div class="kv"><span class="k" style="color:var(--hub-muted)">Language</span><span style="color:#fff">English</span></div>
      </div>`;
  }
}
function projectCard(p, recent) {
  const el = document.createElement('div');
  el.className = 'project-card';
  el.innerHTML = `
    <div class="thumb" style="background:hsl(${p.hue} 28% 22%)">${p.emoji}</div>
    <h3>${p.name}</h3>
    <div class="row">
      <span class="ver-chip">${p.ver}</span>
      <span>${recent ? p.modified : 'Unity · ' + p.modified}</span>
      <span class="favorite ${state.favorites.has(p.name) ? 'on' : ''}" title="Favorite">★</span>
    </div>`;
  el.querySelector('.thumb').onclick = () => openEditor(p);
  el.onclick = e => { if (!e.target.classList.contains('favorite')) openEditor(p); };
  el.querySelector('.favorite').onclick = e => {
    e.stopPropagation();
    state.favorites.has(p.name) ? state.favorites.delete(p.name) : state.favorites.add(p.name);
    renderHub();
  };
  return el;
}
function renderProjectCards(sel, favOnly) {
  const grid = $(sel);
  grid.innerHTML = '';
  state.projects.filter(p => favOnly === state.favorites.has(p.name)).forEach(p => grid.appendChild(projectCard(p, favOnly)));
  if (!grid.children.length) grid.innerHTML = `<div style="color:var(--hub-muted);grid-column:1/-1;padding:20px 4px">${favOnly ? 'No favorite projects yet — click ★ on a project.' : 'No projects in this view.'}</div>`;
}
function filterProjects(q) {
  document.querySelectorAll('#project-grid .project-card').forEach(c => {
    c.style.display = c.querySelector('h3').textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}
document.querySelectorAll('.hub-nav').forEach(n => n.onclick = () => { state.hubView = n.dataset.view; renderHub(); });

function openNewProject() {
  const ver = $('#proj-ver');
  ver.innerHTML = state.installs.map(i => `<option>${i.ver}</option>`).join('');
  const tg = $('#tpl-grid');
  tg.innerHTML = TEMPLATES.map(t => `
    <div class="tpl ${t.id === selectedTemplate ? 'selected' : ''}" data-tpl="${t.id}">
      <div class="art" style="background:hsl(${t.bg} 30% 26%)">${t.emoji}</div>
      <div class="nm">${t.name}</div>
      <div class="ds">${t.desc}</div>
    </div>`).join('');
  tg.querySelectorAll('.tpl').forEach(el => el.onclick = () => {
    selectedTemplate = el.dataset.tpl;
    tg.querySelectorAll('.tpl').forEach(x => x.classList.toggle('selected', x === el));
  });
  $('#modal-overlay').classList.add('open');
}
$('#tpl-cancel').onclick = () => $('#modal-overlay').classList.remove('open');
$('#tpl-create').onclick = () => {
  const name = $('#proj-name').value.trim() || 'MyUnityProject';
  $('#modal-overlay').classList.remove('open');
  const tpl = TEMPLATES.find(t => t.id === selectedTemplate);
  state.projects.unshift({ name, ver: '6000.1.7f1', modified: 'just now', hue: tpl.bg, emoji: tpl.emoji, target: selectedTemplate === '2d' ? 'plane' : 'cube' });
  openEditor(state.projects[0]);
};

function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#2b2b2b;border:1px solid #4a4a4a;color:#e1e1e1;padding:10px 18px;border-radius:8px;z-index:99;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4)';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ================================================================
   PART 2 — UNITY EDITOR (Three.js workspace)
   ================================================================ */
let editorReady = false;
function openEditor(project) {
  $('#hub').classList.add('hidden');
  const ed = $('#editor');
  ed.style.display = 'flex';
  status(`Opening project "${project.name}" (Editor ${project.ver})…`);
  if (!editorReady) { initEditor(); editorReady = true; }
  resetSceneFor(project);
  status(`Loaded SampleScene — ${project.name} (Editor ${project.ver})`);
  log('sys', `Project opened: ${project.name} @ ${$('#proj-loc').value || '~/UnityProjects'}`);
}

const ed = {
  objects: [], selected: null, idSeq: 1, tool: 'move', playing: false, paused: false,
  viewTab: 'scene', playSnapshot: null, history: [], redoStack: [],
};

/* ---- three.js setup ---- */
const container = $('#scene-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
container.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x262626);
const sceneCamera = new THREE.PerspectiveCamera(60, 1, 0.1, 2000);
sceneCamera.position.set(5, 5.5, 6);
sceneCamera.lookAt(0, 0.5, 0);
const gameCamera = new THREE.PerspectiveCamera(60, 1, 0.1, 2000);
gameCamera.position.set(0, 2, -6);
gameCamera.lookAt(0, 0.5, 0);
const orbit = new OrbitControls(sceneCamera, renderer.domElement);
orbit.target.set(0, 0.5, 0);
orbit.enableDamping = true; orbit.dampingFactor = 0.12;
orbit.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };

const grid = new THREE.GridHelper(60, 60, 0x4a4a4a, 0x323232);
scene.add(grid);
const hemi = new THREE.HemisphereLight(0xffffff, 0x444455, 0.55);
scene.add(hemi);

const tcontrols = new TransformControls(sceneCamera, renderer.domElement);
tcontrols.addEventListener('dragging-changed', e => {
  orbit.enabled = !e.value;
  if (e.value) pushHistory(); // snapshot pre-drag state
});
scene.add(tcontrols);

/* axis gizmo (scene view corner) */
const axCanvas = $('#axis-gizmo');
const axCtx = axCanvas.getContext('2d');

/* object factory */
const GEOM = {
  cube: () => new THREE.BoxGeometry(1, 1, 1),
  sphere: () => new THREE.SphereGeometry(0.5, 24, 16),
  cylinder: () => new THREE.CylinderGeometry(0.5, 0.5, 1, 24),
  capsule: () => new THREE.CapsuleGeometry(0.35, 0.6, 8, 16),
  plane: () => new THREE.PlaneGeometry(4, 4),
};
function makeObject(type, opts = {}) {
  let obj;
  if (type === 'light') {
    obj = new THREE.DirectionalLight(0xffffff, 1.6);
    obj.position.set(0, 6, 0);
    const helper = new THREE.DirectionalLightHelper(obj, 1.2, 0x7a7a7a);
    scene.add(helper); obj.userData.helper = helper;
  } else if (type === 'pointlight') {
    obj = new THREE.PointLight(0xffffff, 8, 0, 2);
    obj.position.set(0, 2.5, 0);
    const helper = new THREE.PointLightHelper(obj, 0.35, 0x7a7a7a);
    scene.add(helper); obj.userData.helper = helper;
  } else if (type === 'camera') {
    obj = new THREE.PerspectiveCamera(60, 16 / 9, 0.1, 500);
    obj.position.set(0, 2, -6); obj.lookAt(0, 0.5, 0);
    const helper = new THREE.CameraHelper(obj);
    helper.userData.isCamHelper = true;
    scene.add(helper); obj.userData.helper = helper;
  } else {
    const geo = GEOM[type]();
    if (type === 'plane') { geo.rotateX(-Math.PI / 2); }
    const mat = new THREE.MeshStandardMaterial({ color: 0xcfcfcf, roughness: 0.65, metalness: 0.05 });
    obj = new THREE.Mesh(geo, mat);
    if (type === 'plane') { obj.position.y = 0; } else { obj.position.y = (type === 'capsule') ? 0.65 : 0.5; }
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), new THREE.LineBasicMaterial({ color: 0x3a6ea5 }));
    edges.visible = false; edges.userData.isOutline = true;

  obj.userData.id = ed.idSeq++;
  obj.userData.type = type;
  obj.userData.name = opts.name || defaultName(type);
  obj.userData.components = { meshRenderer: true, collider: type !== 'plane', script: null, ...opts.components };
  obj.userData.scriptParams = { speed: 90, amp: 0.5 };

}
function defaultName(type) {
  const names = { cube: 'Cube', sphere: 'Sphere', cylinder: 'Cylinder', capsule: 'Capsule', plane: 'Plane', light: 'Directional Light', pointlight: 'Point Light', camera: 'Camera' };
  const base = names[type];
  const n = ed.objects.filter(o => o.userData.name.startsWith(base)).length;
  return n ? `${base} (${n + 1})` : base;
}
function removeHelper(o) { if (o.userData.helper) scene.remove(o.userData.helper); }

function resetSceneFor(project) {
  ed.objects.slice().forEach(o => { removeHelper(o); scene.remove(o); });
  ed.objects = []; ed.selected = null; ed.playing = false; ed.paused = false;
  tcontrols.detach(); ed.history = []; ed.redoStack = [];
  makeObject('camera', { name: 'Main Camera' });
  makeObject('light', { name: 'Directional Light' });
  const cube = makeObject(project.target || 'cube', { name: 'Player' });
  cube.material.color.set(0xcfcfcf);
  if (project.target === 'sphere') cube.position.set(0, 0.5, 0);
  if (project.target === 'plane') cube.position.set(0, 0.01, 0);
  const ground = makeObject('plane', { name: 'Ground' });
  ground.scale.set(3, 1, 3);
  ground.material.color.set(0x8a8f7a);
  ground.userData.components.collider = false;
  ed.selected = null;
  renderHierarchy(); renderInspector(); renderProjectWindow();
  log('sys', 'SampleScene loaded (2 objects + Ground)');
}

function initEditor() {
  bindToolbar(); bindMenus(); bindKeys(); bindPanels();
  renderProjectWindow();
  const ro = new ResizeObserver(resize);
  ro.observe(container);
  resize();
  renderer.domElement.addEventListener('pointerdown', onScenePointerDown);
  renderer.domElement.addEventListener('pointermove', onSceneHover);
  tcontrols.addEventListener('objectChange', () => { renderInspector(); });
  requestAnimationFrame(loop);
}

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h);
  sceneCamera.aspect = w / h; sceneCamera.updateProjectionMatrix();
  gameCamera.aspect = w / h; gameCamera.updateProjectionMatrix();
}

/* ---- picking ---- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointer, activeCamera());
  const hits = raycaster.intersectObjects(ed.objects, false);
  return hits.length ? hits[0].object : null;
}
function onScenePointerDown(e) {
  if (e.button !== 0) return;
  const hit = pick(e);
  const down = { x: e.clientX, y: e.clientY };
  const up = ev => {
    renderer.domElement.removeEventListener('pointerup', up);
    if (Math.hypot(ev.clientX - down.x, ev.clientY - down.y) < 4) select(hit);
  };
  renderer.domElement.addEventListener('pointerup', up);
}
function onSceneHover(e) {
  const hit = pick(e);
  renderer.domElement.style.cursor = hit ? 'pointer' : (ed.tool === 'hand' ? 'grab' : 'default');
  ed.objects.forEach(o => { if (o.userData.outline && o !== ed.selected) o.userData.outline.visible = false; });
  if (hit && hit.userData.outline && hit !== ed.selected) {
    hit.userData.outline.material.color.set(0xd98a3d);
    hit.userData.outline.visible = true;
  }
}
function select(obj) {
  if (ed.selected && ed.selected.userData.outline) ed.selected.userData.outline.visible = false;
  ed.selected = obj;
  if (obj) {
    if (obj.userData.outline) { obj.userData.outline.material.color.set(0x3a6ea5); obj.userData.outline.visible = true; }
    if (ed.tool !== 'hand' && ed.tool !== 'rect') { tcontrols.attach(obj); setGizmoMode(); }
    else tcontrols.detach();
    status(`Selected: ${obj.userData.name}`);
  } else {
    tcontrols.detach();
  }
  renderHierarchy(); renderInspector();
}

/* ---- hierarchy ---- */
const ICONS = { cube: '▪', sphere: '●', cylinder: '▮', capsule: '⬮', plane: '▬', light: '☀', pointlight: '💡', camera: '🎥' };
function renderHierarchy() {
  const h = $('#hierarchy');
  h.innerHTML = '';
  ed.objects.forEach(o => {
    const row = document.createElement('div');
    row.className = 'hitem' + (o === ed.selected ? ' selected' : '');
    row.innerHTML = `<span class="icon">${ICONS[o.userData.type] || '▪'}</span>${o.userData.name}`;
    row.onclick = () => select(o);
    row.ondblclick = () => {
      const n = prompt('Rename object', o.userData.name);
      if (n) { o.userData.name = n; renderHierarchy(); renderInspector(); }
    };
    row.oncontextmenu = e => { e.preventDefault(); select(o); };
    h.appendChild(row);
  });
}

function vec3(label, kind, v) {
  return `<div class="vec3"><span class="lbl">${label}</span>${['x', 'y', 'z'].map(ax =>
    `<span class="cell"><span class="ax" style="color:${axColor(ax)}">${ax.toUpperCase()}</span><input type="number" step="0.1" data-kind="${kind}" data-ax="${ax}" value="${fmt(v[ax])}" /></span>`).join('')}</div>`;
}
function axColor(ax) { return ax === 'x' ? 'var(--ed-gizmo-x)' : ax === 'y' ? 'var(--ed-gizmo-y)' : 'var(--ed-gizmo-z)'; }
function fmt(n) { return Math.round(n * 100) / 100; }
function bindVec3(kind, o) {
  document.querySelectorAll(`input[data-kind="${kind}"]`).forEach(inp => {
    inp.onchange = () => {
      const val = parseFloat(inp.value || 0);
      const ax = inp.dataset.ax;
      if (kind === 'pos') o.position[ax] = val;
      if (kind === 'scl') o.scale[ax] = val || 0.01;
      if (kind === 'rot') o.rotation[ax] = THREE.MathUtils.degToRad(val);
    };
  });

/* ---- project window & console ---- */
function renderProjectWindow() {
  const b = $('#bottom-body');
  if (b.dataset.tab === 'console') return;
  const assets = [
    ['SampleScene.unity', '🗂️'], ['Player.cs', '📜'], ['Spin.cs', '📜'], ['Bob.cs', '📜'],
    ['Ground.mat', '🎨'], ['Player.mat', '🎨'], ['Sprites', '🖼️'], ['Prefabs', '📦'],
  ];

function log(kind, msg) {
  const b = $('#bottom-body');
  if (b.dataset.tab !== 'console') { b.dataset.pending = (b.dataset.pending || '') ; }
  const line = document.createElement('div');
  line.className = 'console-line ' + kind;

  line.innerHTML = `<span class="t">${t.getHours().toString().padStart(2, '0')}:${t.getMinutes().toString().padStart(2, '0')}:${t.getSeconds().toString().padStart(2, '0')}</span><span>${msg}</span>`;
  if (b.dataset.tab === 'console') b.prepend(line);
  else (b.dataset.pending = (b.dataset.pending || '') + line.outerHTML);
}
function showConsole() {

}
function showProject() {

function showServices() {

/* ---- toolbar / menus / keys ---- */
function setGizmoMode() {
  if (ed.tool === 'move') tcontrols.setMode('translate');
  if (ed.tool === 'rotate') tcontrols.setMode('rotate');
  if (ed.tool === 'scale') tcontrols.setMode('scale');
}
function bindToolbar() {
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tool[data-tool]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    ed.tool = b.dataset.tool;
    if (ed.selected && !['hand', 'rect'].includes(ed.tool)) { tcontrols.attach(ed.selected); setGizmoMode(); }
    else tcontrols.detach();
  });
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => handleAction(b.dataset));
  document.querySelectorAll('.ptab[data-viewtab]').forEach(t => t.onclick = () => {
    document.querySelectorAll('.ptab[data-viewtab]').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    ed.viewTab = t.dataset.viewtab;
    if (ed.viewTab === 'game') log('sys', 'Switched to Game view (Main Camera)');
  });
  document.querySelectorAll('.ptab[data-bottomtab]').forEach(t => t.onclick = () => {
    document.querySelectorAll('.ptab[data-bottomtab]').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    ({ project: showProject, console: showConsole, services: showServices })[t.dataset.bottomtab]();
  });
  $('#chk-grid').onchange = e => grid.visible = e.target.checked;
  $('#chk-gizmos').onchange = e => {
    ed.objects.forEach(o => { if (o.userData.helper) o.userData.helper.visible = e.target.checked; });
  };
  $('#chk-wire').onchange = e => {
    ed.objects.forEach(o => {
      if (o.isMesh) { o.material.wireframe = e.target.checked; if (o.userData.outline) o.userData.outline.visible = !e.target.checked && o === ed.selected; }
    });
  };
}
function bindMenus() {
  document.querySelectorAll('.ed-menu').forEach(m => {
    m.querySelector('button').onclick = e => {
      e.stopPropagation();
      const open = m.classList.contains('open');
      document.querySelectorAll('.ed-menu').forEach(x => x.classList.remove('open'));
      if (!open) m.classList.add('open');
    };
  });
  document.addEventListener('click', () => document.querySelectorAll('.ed-menu').forEach(x => x.classList.remove('open')));
}
function handleAction(d) {
  if (d.act === 'create') { pushHistory(); const o = makeObject(d.type); select(o); log('sys', `Created ${o.userData.name}`); }
  if (d.act === 'delete' && ed.selected) { deleteSelected(); }
  if (d.act === 'duplicate' && ed.selected) { duplicateSelected(); }
  if (d.act === 'addcomp' && ed.selected) {
    ed.selected.userData.components.script = d.comp;
    renderInspector();
    log('sys', `Attached ${d.comp}.cs to ${ed.selected.userData.name}`);
  }
  if (d.act === 'play') togglePlay();
  if (d.act === 'pause') togglePause();
  if (d.act === 'step') stepPlay();
  if (d.act === 'undo') undo();
  if (d.act === 'redo') redo();
  if (d.act === 'new-scene') { resetSceneFor({ target: 'cube', name: 'Untitled', ver: '6000.1.7f1' }); log('sys', 'New SampleScene created'); }
  if (d.act === 'save-scene') {
    const data = JSON.stringify(ed.objects.map(o => ({ name: o.userData.name, type: o.userData.type, p: o.position.toArray(), r: [o.rotation.x, o.rotation.y, o.rotation.z], s: o.scale.toArray() })));
    localStorage.setItem('unitycraft-scene', data);
    log('sys', 'SampleScene saved (localStorage)');
    toast('Scene saved');
  }
  if (d.act === 'open-scene') {
    const data = localStorage.getItem('unitycraft-scene');
    if (!data) { log('warn', 'No saved scene found'); toast('No saved scene'); return; }
    resetSceneFor({ target: 'cube', name: 'Untitled', ver: '6000.1.7f1' });
    JSON.parse(data).forEach(d0 => {
      const o = makeObject(d0.type, { name: d0.name });
      o.position.fromArray(d0.p); o.scale.fromArray(d0.s);
      o.rotation.set(d0.r[0], d0.r[1], d0.r[2]);
    });
    log('sys', 'Scene loaded from save');
  }
  if (d.act === 'back-hub') { $('#editor').style.display = 'none'; $('#hub').classList.remove('hidden'); renderHub(); }
  if (d.act === 'about') toast('UnityCraft — a browser reconstruction. Not affiliated with Unity Technologies.');
}
function deleteSelected() {
  const o = ed.selected; if (!o) return;
  pushHistory(); // snapshot before mutation
  removeHelper(o); scene.remove(o);
  ed.objects = ed.objects.filter(x => x !== o);
  ed.selected = null; tcontrols.detach();
  renderHierarchy(); renderInspector();
  log('warn', `Deleted ${o.userData.name}`);
}
function duplicateSelected() {
  const o = ed.selected; if (!o) return;
  pushHistory(); // snapshot before mutation
  const c = makeObject(o.userData.type, { name: o.userData.name + ' (copy)' });
  c.position.copy(o.position).x += 1.5;
  c.scale.copy(o.scale); c.rotation.copy(o.rotation);
  if (c.material && o.material) c.material.color.copy(o.material.color);
  select(c);
  log('sys', `Duplicated ${o.userData.name}`);
}
function togglePlay() {
  if (!ed.playing) {
    ed.playSnapshot = ed.objects.map(o => ({ o, p: o.position.clone(), r: o.rotation.clone(), s: o.scale.clone() }));
    ed.playing = true; ed.paused = false;
    document.querySelector('[data-act="play"]').classList.add('active');
    status('Play mode — press Stop to return to editing');
    log('sys', 'Entered Play Mode');
  } else {
    ed.playing = false; ed.paused = false;
    document.querySelector('[data-act="play"]').classList.remove('active');
    document.querySelector('[data-act="pause"]').classList.remove('active');
    if (ed.playSnapshot) ed.playSnapshot.forEach(({ o, p, r, s }) => { o.position.copy(p); o.rotation.copy(r); o.scale.copy(s); });
    ed.playSnapshot = null;
    renderInspector();
    log('sys', 'Exited Play Mode (scene state restored)');
  }
}
function togglePause() {
  if (!ed.playing) return;
  ed.paused = !ed.paused;
  document.querySelector('[data-act="pause"]').classList.toggle('active', ed.paused);
}
function stepPlay() {
  if (ed.playing && ed.paused) { advancePlay(1 / 60); }
}
function undo() {
  if (!ed.history.length) { toast('Nothing to undo'); return; }
  ed.redoStack.push(snapshotScene());
  applySnapshot(ed.history.pop());
  log('sys', 'Undo');
}
function redo() {
  if (!ed.redoStack.length) return;
  ed.history.push(snapshotScene());
  applySnapshot(ed.redoStack.pop());
  log('sys', 'Redo');
}
function snapshotScene() {
  return ed.objects.map(o => ({ ref: o, name: o.userData.name, type: o.userData.type, p: o.position.clone(), r: o.rotation.clone(), s: o.scale.clone() }));
}
function applySnapshot(snap) {
  const keep = ed.objects.slice();
  keep.forEach(o => { if (!snap.find(x => x.ref === o)) { removeHelper(o); scene.remove(o); } });
  ed.objects = snap.map(x => {
    if (!x.ref.parent) { scene.add(x.ref); }
    x.ref.userData.name = x.name;
    x.ref.position.copy(x.p); x.ref.rotation.copy(x.r); x.ref.scale.copy(x.s);
    return x.ref;
  });
  ed.selected = null; tcontrols.detach();
  renderHierarchy(); renderInspector();
}
function pushHistory() { ed.history.push(snapshotScene()); ed.redoStack.length = 0; if (ed.history.length > 50) ed.history.shift(); }

function bindKeys() {
  document.addEventListener('keydown', e => {
    if ($('#editor').style.display === 'none') return;
    if (e.target.matches('input, select, textarea')) return;
    const k = e.key.toLowerCase();
    const tools = { q: 'hand', w: 'move', e: 'rotate', r: 'scale', t: 'rect' };
    if (tools[k]) { document.querySelector(`.tool[data-tool="${tools[k]}"]`).click(); return; }
    if (k === 'f' && ed.selected) {
      orbit.target.copy(ed.selected.position);
      status(`Framed ${ed.selected.userData.name}`);
    }
    if (k === 'delete') deleteSelected();
    if (e.ctrlKey && k === 'd') { e.preventDefault(); duplicateSelected(); }
    if (e.ctrlKey && k === 's') { e.preventDefault(); handleAction({ act: 'save-scene' }); }
    if (e.ctrlKey && k === 'z') { e.preventDefault(); undo(); }
    if (e.ctrlKey && k === 'y') { e.preventDefault(); redo(); }
    if (k === 'p') togglePlay(); // Unity: Ctrl+P
  });
}
function bindPanels() { /* future drag-resize */ }

/* ---- status & stats ---- */
function status(msg) { $('#status-msg').textContent = msg; }
function activeCamera() { return ed.viewTab === 'game' ? gameCamera : sceneCamera; }

/* ---- render loop ---- */
let lastT = performance.now(); let frames = 0; let fpsT = 0;
function advancePlay(dt) {
  ed.objects.forEach(o => {
    const sc = o.userData.components.script;
    if (sc === 'SpinScript') o.rotation.y += THREE.MathUtils.degToRad(o.userData.scriptParams.speed) * dt;
    if (sc === 'BobScript') o.position.y += Math.sin(performance.now() / 300) * o.userData.scriptParams.amp * dt * 2;
  });
}
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  if (ed.playing && !ed.paused) advancePlay(dt);
  if (ed.viewTab === 'scene') orbit.update();
  const helpersVisible = $('#chk-gizmos').checked;
  grid.visible = ed.viewTab === 'scene' && $('#chk-grid').checked;
  ed.objects.forEach(o => { if (o.userData.helper) o.userData.helper.visible = helpersVisible && ed.viewTab === 'scene'; });
  renderer.render(scene, activeCamera());
  drawAxisGizmo();
  frames++; fpsT += dt;
  if (fpsT > 0.5) {
    $('#status-fps').textContent = `${Math.round(frames / fpsT)} fps`;
    $('#status-objcount').textContent = `${ed.objects.length} objects`;
    frames = 0; fpsT = 0;
  }
}
function drawAxisGizmo() {
  const cam = activeCamera();
  const m = cam.matrixWorldInverse.clone();
  const w = axCanvas.width / 2, h = axCanvas.height / 2;
  axCtx.clearRect(0, 0, axCanvas.width, axCanvas.height);
  axCtx.save(); axCtx.translate(w, h);
  const axes = [[1, 0, 0, '#e23d4e', 'X'], [0, 1, 0, '#63a83b', 'Y'], [0, 0, 1, '#3a7bd0', 'Z']];
  const proj = v => {
    const p = new THREE.Vector3(v[0], v[1], v[2]).applyMatrix4(m);
    return [p.x * 62, -p.y * 62, p.z];
  };
  axes.sort((a, b) => proj(b)[2] - proj(a)[2]);
  axes.forEach(a => {
    const [x, y] = proj(a);
    axCtx.strokeStyle = a[3]; axCtx.fillStyle = a[3]; axCtx.lineWidth = 2.5;
    axCtx.beginPath(); axCtx.moveTo(0, 0); axCtx.lineTo(x, y); axCtx.stroke();
    axCtx.beginPath(); axCtx.arc(x, y, 5.5, 0, Math.PI * 2); axCtx.fill();
    axCtx.font = '600 11px Inter, sans-serif';
    axCtx.fillText(a[4], x + 9, y + 4);
  });
  axCtx.restore();
}

/* ---- boot: show Hub after loading screen (mirrors Hub splash) ---- */
window.unitycraft = { ed, scene, makeObject }; // debug/test handle
renderHub();
setTimeout(() => $('#loading').classList.add('is-dismissed'), 1400);
</script>
