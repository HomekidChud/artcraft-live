<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1c1f">
  <meta name="description" content="EffectCraft: motion graphics and visual effects in the browser">
  <title>EffectCraft</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-256.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1c1f; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; color: #c9c9cc;
      font: 14px/1.4 system-ui, sans-serif; pointer-events: none;
    }
    #loading img { width: 56px; height: 56px; }
    #loading .err { color: #ff8a7a; white-space: pre-wrap; max-width: 70ch; pointer-events: auto; }
    #recovery { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 70ch; pointer-events: auto; }
    #recovery[hidden] { display: none; }
    #recovery p { flex-basis: 100%; margin: 0; text-align: center; }
    #recovery a { padding: 7px 11px; border: 1px solid #55504a; border-radius: 7px; color: #f1d18e; text-decoration: none; background: #292720; }
    #recovery a:hover { border-color: #e4b65c; background: #373225; }
    #loading details { max-width: 70ch; pointer-events: auto; color: #a9a9ac; font-size: 12px; }
    #loading details summary { cursor: pointer; }
    #loading details pre { max-height: 28vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
    #device-lost {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
      align-items: center; justify-content: center; padding: 16px; text-align: center;
      background: rgb(18 18 18 / 0.85); color: #c8c8c8; font: 14px/1.4 system-ui, sans-serif;
    }
    #device-lost strong { color: #e3e3e3; font-size: 16px; }
    #device-lost p { margin: 0; max-width: 60ch; }
    #device-lost small { color: #8c8c8c; font-size: 12px; }
    #device-lost div { display: flex; gap: 8px; }
    #device-lost button {
      padding: 6px 14px; border: 1px solid #3a3a3a; border-radius: 4px;
      background: #232323; color: #e3e3e3; font: inherit; cursor: pointer;
    }
    #device-lost button:hover { background: #303030; }
    #device-lost button:last-child { background: #2d8ceb; border-color: #2d8ceb; }
    #device-lost button:last-child:hover { background: #4aa0f5; }
    #device-lost button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <canvas id="effectcraft_canvas"></canvas>
  <div id="loading"><img src="favicon.svg" alt=""><div id="status">Loading EffectCraft…</div><div id="recovery" hidden><p>If startup is stuck or fails, reload the page:</p><a id="reload">Reload the page</a></div></div>
  <script>
    (() => {
      const status = document.getElementById("status");
      const recovery = document.getElementById("recovery");
      const reload = document.getElementById("reload");
      if (reload) reload.href = location.href;
      const showError = error => {
        if (!recovery.isConnected) return;
        recovery.hidden = false;
        status.className = "err";
        status.textContent = "EffectCraft could not start. Reload the page to try again; the technical details are below.";
        if (document.getElementById("startup-error-details")) return;
        const details = document.createElement("details"); details.id = "startup-error-details";
        const summary = document.createElement("summary"); summary.textContent = "Technical error details";
        const pre = document.createElement("pre"); pre.textContent = String(error?.stack || error || "Unknown startup error");
        details.append(summary, pre); recovery.after(details);
      };
      // GPU availability: EffectCraft's canvas needs WebGPU or WebGL2 — v0.11.1 has
      // no CPU canvas path (the ?webgl/?cpu flags in the upstream hosting README
      // are not read by the app, so they are no-ops and are not treated as
      // choices). When the browser has neither, do not download and start the
      // app at all: explain immediately instead.
      window.effectcraftRendererProbe = (async () => {
        let webgpu = false;
        if (navigator.gpu) {
          // Resolve (never reject) after the timeout, and only create it when an
          // adapter request is actually raced, so no promise is left unhandled.
          let timer;
          const timeout = new Promise((resolve) => { timer = setTimeout(() => resolve(null), 4000); });
          try {
            webgpu = !!(await Promise.race([navigator.gpu.requestAdapter(), timeout]));
          } catch { webgpu = false; }
          clearTimeout(timer);
        }
        if (!webgpu) {
          let webgl2 = false;
          try { webgl2 = !!document.createElement("canvas").getContext("webgl2"); } catch { webgl2 = false; }
          if (!webgl2) { window.effectcraftNoGpu = true; return "none"; }
        }
      })();
      const timer = setTimeout(() => { recovery.hidden = false; }, 12000);
      window.effectcraftRecovery = {ready: () => clearTimeout(timer), fail: error => { clearTimeout(timer); showError(error); }};
      window.addEventListener("error", event => {
        if (event.target === window || event.target?.tagName === "SCRIPT") showError(event.error || event.message);
      }, true);
      window.addEventListener("unhandledrejection", event => showError(event.reason));
    })();
  </script>
  <script type="module">
    // Wait for the renderer probe: on a browser with neither WebGPU nor WebGL2
    // it reports the limitation instead of downloading an app that cannot run.
    await window.effectcraftRendererProbe;
    if (window.effectcraftNoGpu) {
      window.effectcraftRecovery.ready();
      const status = document.getElementById("status");
      status.className = "err";
      status.textContent = "EffectCraft needs WebGL2 or WebGPU for its canvas, and this browser has neither, so the app cannot run here. Try a current desktop browser (Chrome, Edge, Firefox or Safari).";
      const recovery = document.getElementById("recovery");
      const p = recovery.querySelector("p");
      if (p) p.textContent = "The app was not downloaded because it cannot run in this browser. If you think this is wrong, reload:";
      recovery.hidden = false;
    } else {
    const ec = await import("./effectcraft_web.js");
    const init = ec.default;
    const t0 = performance.now();
    window.effectcraftLoad = {};
    // The agent / test API: the desktop control channel as promises (docs/web.md).
    window.effectcraft = {
      request: (method, params) => ec.request(method, params ?? {}),
      execute: (command, params) => ec.request("engine.execute", { command, params: params ?? {} }),
      commands: () => ec.request("engine.commands", {}),
      inspect: () => ec.request("ui.inspect", {}),
      screenshot: (params) => ec.request("ui.screenshot", params ?? {}),
      renderFrame: (params) => ec.request("render.frame", { base64: true, ...(params ?? {}) }),
      files: () => ec.files(),
      readFile: (path) => ec.readFile(path),
      addFile: async (fileOrUrl, name) => {
        let bytes;
        if (typeof fileOrUrl === "string") {
          bytes = new Uint8Array(await (await fetch(fileOrUrl)).arrayBuffer());
          name = name ?? fileOrUrl.split("/").pop();
        } else {
          bytes = new Uint8Array(await fileOrUrl.arrayBuffer());
          name = name ?? fileOrUrl.name;
        }
        return ec.addFile(name, bytes);
      },
      info: () => ({
        ...ec.info(),
        crossOriginIsolated: self.crossOriginIsolated,
        webgpu: !!navigator.gpu,
        serviceWorker: !!(navigator.serviceWorker && navigator.serviceWorker.controller),
        load: window.effectcraftLoad,
      }),
      // Browser storage (OPFS / IndexedDB): save without downloading, list, remove, wait for writes.
      saveToBrowser: (path) => ec.saveToBrowser(path ?? undefined),
      listStored: () => ec.listStored(),
      removeStored: (path) => ec.removeStored(path),
      flush: () => ec.flush(),
      // A frame rendered in a frame worker (its GPU by default) vs the page's CPU: {maxDiff, meanDiff, over4, …}.
      workerFrameCheck: (params) => ec.workerFrameCheck(params ?? {}).then(JSON.parse),
    };
    // Offline start and install (PWA): the service worker caches the app's files.
    if ("serviceWorker" in navigator && !new URLSearchParams(location.search).has("nosw")) {
      navigator.serviceWorker.register("sw.js").catch((e) => console.warn("service worker:", e));
    }
    await (async () => {
      try {
        // Compile once: the page and its render workers instantiate the same module.
        const wasmUrl = new URL("effectcraft_web_bg.wasm", location.href);
        let module;
        try {
          module = await WebAssembly.compileStreaming(fetch(wasmUrl));
        } catch {
          module = await WebAssembly.compile(await (await fetch(wasmUrl)).arrayBuffer());
        }
        window.effectcraftModule = module;
        await init({ module_or_path: module });
        window.effectcraftLoad.wasmMs = performance.now() - t0;
        await ec.start("effectcraft_canvas");
        window.effectcraftRecovery.ready();
        window.effectcraftLoad.readyMs = performance.now() - t0;
      } catch (e) {
        window.effectcraftRecovery.fail(e);
        window.effectcraftLoad.error = String(e);
        throw e;
      }
    })();
    }
  </script>
<script src="../assistant/widget.js" data-craft="effectcraft" defer></script>
</body>
</html>
